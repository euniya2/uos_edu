<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>한가위 추석 인사 카드</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Google Fonts for Korean Traditional Aesthetic -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@400;700&family=Noto+Serif+KR:wght@600;900&display=swap" rel="stylesheet">
    <!-- html2canvas for card image download -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>

    <style>
        body {
            font-family: 'Gowun Batang', 'Noto Serif KR', serif;
            background-color: #050b18;
            color: #ffffff;
            touch-action: manipulation;
        }

        /* Single uniform text color across all text elements on the card */
        .card-text-single-color {
            color: #fffdf0; /* Warm crisp ivory white */
            text-shadow: 0 0 12px rgba(255, 253, 240, 0.4);
        }

        /* 1. Initial Moon Rise animation from bottom */
        @keyframes moonRise {
            0% {
                opacity: 0;
                transform: translateY(280px) scale(0.5);
            }
            100% {
                opacity: 1;
                transform: translateY(0) scale(1);
            }
        }

        .moon-rise-wrapper {
            animation: moonRise 3.5s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }

        /* 2. Continuous floating animation so the moon is ALWAYS moving */
        @keyframes moonFloat {
            0% {
                transform: translateY(0px) rotate(0deg);
            }
            50% {
                transform: translateY(-14px) rotate(1.5deg);
            }
            100% {
                transform: translateY(0px) rotate(0deg);
            }
        }

        .moon-float-wrapper {
            animation: moonFloat 4.5s ease-in-out infinite;
        }

        /* Moon glow animation */
        @keyframes moonGlow {
            0%, 100% {
                box-shadow: 0 0 50px rgba(254, 243, 199, 0.6), 0 0 100px rgba(253, 224, 71, 0.25);
            }
            50% {
                box-shadow: 0 0 70px rgba(254, 243, 199, 0.8), 0 0 130px rgba(253, 224, 71, 0.35);
            }
        }

        .full-moon-glow {
            animation: moonGlow 5s infinite ease-in-out;
        }

        /* Enhanced star twinkling with glow and scale animations */
        @keyframes twinkle {
            0%, 100% { 
                opacity: 0.15; 
                transform: scale(0.6);
                box-shadow: 0 0 2px rgba(255, 255, 255, 0.2);
            }
            50% { 
                opacity: 1; 
                transform: scale(1.4);
                box-shadow: 0 0 8px rgba(255, 253, 240, 0.9), 0 0 14px rgba(253, 224, 71, 0.6);
            }
        }

        /* Sparkle Diamond Star Animation */
        @keyframes sparklePulse {
            0%, 100% {
                opacity: 0.1;
                transform: scale(0.4) rotate(0deg);
            }
            50% {
                opacity: 1;
                transform: scale(1.5) rotate(90deg);
                filter: drop-shadow(0 0 6px rgba(254, 243, 199, 1));
            }
        }

        .star {
            position: absolute;
            background-color: #ffffff;
            border-radius: 50%;
            animation: twinkle 3s infinite ease-in-out;
        }

        .star.sparkle-star {
            background-color: #fef08a;
            clip-path: polygon(50% 0%, 63% 37%, 100% 50%, 63% 63%, 50% 100%, 37% 63%, 0% 50%, 37% 37%);
            border-radius: 0;
            animation: sparklePulse 2.8s infinite ease-in-out;
        }

        /* Floating cloud movement */
        @keyframes floatCloud {
            0% { transform: translateX(-10%); }
            50% { transform: translateX(10%); }
            100% { transform: translateX(-10%); }
        }

        .animated-cloud {
            animation: floatCloud 20s ease-in-out infinite;
        }

        /* Flying Wish Element */
        .flying-wish-text {
            position: fixed;
            z-index: 1000;
            pointer-events: none;
            color: #fef08a;
            font-weight: 700;
            font-size: 1.125rem;
            text-shadow: 0 0 10px #fde047, 0 0 20px #eab308, 0 0 30px rgba(254, 243, 199, 0.8);
            white-space: nowrap;
            transition: transform 0.02s linear;
        }

        /* Sparkle Particle Trail & Burst */
        .wish-particle {
            position: fixed;
            z-index: 999;
            pointer-events: none;
            border-radius: 50%;
            background: radial-gradient(circle, #ffffff 0%, #fef08a 60%, rgba(253, 224, 71, 0) 100%);
            animation: particleFade 0.8s ease-out forwards;
        }

        @keyframes particleFade {
            0% {
                opacity: 1;
                transform: scale(1) translate(0, 0);
            }
            100% {
                opacity: 0;
                transform: scale(0.2) translate(var(--tw-translateX, 0px), var(--tw-translateY, 0px));
            }
        }
    </style>
</head>
<body class="min-h-screen flex flex-col justify-center items-center p-4 selection:bg-amber-200 selection:text-amber-900">

    <main class="flex flex-col items-center justify-center w-full max-w-md my-auto">

        <!-- ========================================== -->
        <!--  CARD ELEMENT (Export Target for Download)  -->
        <!-- ========================================== -->
        <div id="chuseok-card" class="relative w-full aspect-[9/16] max-h-[720px] rounded-3xl overflow-hidden shadow-2xl flex flex-col justify-between items-center p-8 border border-slate-800/80 bg-gradient-to-b from-[#080e21] via-[#0d1836] to-[#162347]">
            
            <!-- Dynamic Stars Overlay -->
            <div id="stars-container" class="absolute inset-0 pointer-events-none overflow-hidden"></div>

            <!-- Traditional Cloud Overlay -->
            <div class="absolute top-12 left-0 w-full opacity-20 pointer-events-none animated-cloud">
                <svg viewBox="0 0 500 150" fill="currentColor" class="w-full h-auto text-amber-100/50">
                    <path d="M 50 80 Q 80 40 120 50 Q 160 20 210 50 Q 250 30 290 60 Q 340 40 380 70 Q 420 50 450 90 Z" />
                </svg>
            </div>

            <!-- Top Spacing / Decorative Header Pattern -->
            <div class="z-10 pt-4 flex flex-col items-center">
                <div class="w-12 h-0.5 bg-amber-100/40 rounded-full mb-1"></div>
                <div class="w-6 h-0.5 bg-amber-100/40 rounded-full"></div>
            </div>

            <!-- Center Content: Giant Full Moon -->
            <div class="z-10 my-auto flex flex-col items-center justify-center w-full">
                <div class="relative flex items-center justify-center moon-rise-wrapper">
                    <!-- Continuous Floating Wrapper -->
                    <div class="moon-float-wrapper relative flex items-center justify-center">
                        <!-- Moon Circle with textures and ambient glow (Click/Tap to replay rise) -->
                        <div onclick="replayMoonRise()" title="달을 클릭하면 다시 떠오릅니다" class="w-48 h-48 sm:w-56 sm:h-56 rounded-full bg-gradient-to-tr from-amber-200 via-amber-100 to-yellow-50 relative overflow-hidden full-moon-glow flex items-center justify-center shadow-inner cursor-pointer transition-transform active:scale-95">
                            
                            <!-- Moon Craters / Texture (Subtle) -->
                            <div class="absolute w-12 h-12 rounded-full bg-amber-300/20 top-6 left-10 blur-[1px]"></div>
                            <div class="absolute w-16 h-16 rounded-full bg-amber-300/15 bottom-8 right-8 blur-[1px]"></div>
                            <div class="absolute w-8 h-8 rounded-full bg-amber-300/20 bottom-12 left-12 blur-[1px]"></div>

                            <!-- Rabbit Silhouette in Moon (Traditional Chuseok Element) -->
                            <svg class="w-20 h-20 text-amber-900/10 opacity-70 pointer-events-none" viewBox="0 0 24 24" fill="currentColor">
                                <path d="M12,2C10.5,2 9.2,2.8 8.5,4C7.8,3.2 6.7,2.7 5.5,2.7C3.3,2.7 1.5,4.5 1.5,6.7C1.5,8.2 2.3,9.5 3.5,10.2C3.2,11.1 3,12 3,13C3,17.4 6.6,21 11,21C12.5,21 13.9,20.6 15.1,19.9C16.2,20.6 17.5,21 19,21C20.7,21 22,19.7 22,18C22,16.5 20.9,15.3 19.5,15.1C19.8,14.2 20,13.1 20,12C20,7.6 16.4,4 12,4V2Z"/>
                            </svg>
                        </div>

                        <!-- Passing Translucent Silhouette Cloud over Moon -->
                        <div class="absolute -bottom-4 -left-6 w-52 h-16 bg-gradient-to-r from-transparent via-indigo-950/70 to-transparent blur-md rounded-full pointer-events-none"></div>
                    </div>
                </div>

                <!-- Big Main Title Text: "한가위 잘 보내세요" -->
                <div class="mt-10 text-center px-4">
                    <h1 class="card-text-single-color text-3xl sm:text-4xl font-black tracking-wider leading-relaxed whitespace-nowrap">
                        한가위 잘 보내세요
                    </h1>
                </div>
            </div>

            <!-- Card Footer: Senders Name: "이정은드림" -->
            <div class="z-10 pb-4 text-center w-full">
                <p class="card-text-single-color text-lg sm:text-xl font-bold tracking-widest opacity-95">
                    이정은드림
                </p>
                <div class="w-8 h-0.5 bg-amber-100/40 rounded-full mx-auto mt-3"></div>
            </div>

        </div>

        <!-- ========================================== -->
        <!--  ACTION BUTTON (Outside Card Container)    -->
        <!-- ========================================== -->
        <div class="mt-6 w-full flex flex-col gap-3">
            <!-- Wish Input Field & Wish Button -->
            <div class="flex gap-2">
                <input 
                    type="text" 
                    id="wish-input" 
                    placeholder="소원을 적어보세요 (예: 모두 건강하게 해주세요)" 
                    maxlength="30"
                    onkeydown="if(event.key === 'Enter') makeWish()"
                    class="flex-1 px-4 py-3.5 rounded-2xl bg-slate-900/90 border border-amber-300/40 text-amber-100 placeholder-amber-200/40 text-sm focus:outline-none focus:border-amber-300 focus:ring-2 focus:ring-amber-300/30 transition-all shadow-inner"
                />
                <button 
                    id="wish-btn" 
                    onclick="makeWish()" 
                    class="px-5 py-3.5 rounded-2xl bg-gradient-to-r from-amber-400 to-yellow-500 hover:from-amber-300 hover:to-yellow-400 text-slate-950 font-bold text-sm shadow-lg hover:shadow-amber-400/20 transform active:scale-95 transition-all duration-200 whitespace-nowrap flex items-center gap-1.5"
                >
                    <svg class="w-4 h-4 text-slate-950 animate-pulse" fill="currentColor" viewBox="0 0 20 20">
                        <path d="M9.049 2.927c.3-.921 1.603-.921 1.902 0l1.07 3.292a1 1 0 00.95.69h3.462c.969 0 1.371 1.24.588 1.81l-2.8 2.034a1 1 0 00-.364 1.118l1.07 3.292c.3.921-.755 1.688-1.54 1.118l-2.8-2.034a1 1 0 00-1.175 0l-2.8 2.034c-.784.57-1.838-.197-1.539-1.118l1.07-3.292a1 1 0 00-.364-1.118L2.98 8.72c-.783-.57-.38-1.81.588-1.81h3.461a1 1 0 00.951-.69l1.07-3.292z"/>
                    </svg>
                    <span>달에게 빌기</span>
                </button>
            </div>

            <!-- Download Button -->
            <button id="download-btn" onclick="downloadCardImage()" class="w-full py-4 px-6 rounded-2xl bg-gradient-to-r from-amber-200 via-amber-300 to-amber-400 hover:from-amber-300 hover:to-amber-500 text-slate-950 font-extrabold text-lg shadow-lg hover:shadow-amber-500/20 transform active:scale-95 transition-all duration-200 flex items-center justify-center gap-2 group">
                <svg class="w-6 h-6 text-slate-950 transition-transform group-hover:translate-y-0.5" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M3 16.5v2.25A2.25 2.25 0 005.25 21h13.5A2.25 2.25 0 0021 18.75V16.5M16.5 12L12 16.5m0 0L7.5 12m4.5 4.5V3"/>
                </svg>
                <span>카드 이미지 저장</span>
            </button>
        </div>

    </main>

    <!-- Custom Toast Message (Replaces alert) -->
    <div id="toast-message" class="fixed bottom-6 left-1/2 transform -translate-x-1/2 bg-slate-900/95 border border-amber-300/40 text-amber-100 px-6 py-3 rounded-xl shadow-2xl transition-all duration-300 opacity-0 pointer-events-none flex items-center gap-2 z-50 text-sm font-medium">
        <svg class="w-5 h-5 text-amber-400" fill="currentColor" viewBox="0 0 20 20">
            <path fill-rule="evenodd" d="M10 18a8 8 0 100-16 8 8 0 000 16zm3.707-9.293a1 1 0 00-1.414-1.414L9 10.586 7.707 9.293a1 1 0 00-1.414 1.414l2 2a1 1 0 001.414 0l4-4z" clip-rule="evenodd"/>
        </svg>
        <span id="toast-text">카드가 이미지로 저장되었습니다!</span>
    </div>

    <script>
        // Make a Wish interaction: fly wish text up to the full moon
        function makeWish() {
            const input = document.getElementById('wish-input');
            const wishText = input.value.trim();

            if (!wishText) {
                showToast("달님에게 빌 소원을 적어주세요!");
                input.focus();
                return;
            }

            const moon = document.querySelector('.full-moon-glow');
            if (!moon) return;

            const moonRect = moon.getBoundingClientRect();
            const inputRect = input.getBoundingClientRect();

            // Starting position (input center)
            const startX = inputRect.left + inputRect.width / 2;
            const startY = inputRect.top + inputRect.height / 2;

            // Target position (moon center)
            const targetX = moonRect.left + moonRect.width / 2;
            const targetY = moonRect.top + moonRect.height / 2;

            // Create flying wish element
            const wishElem = document.createElement('div');
            wishElem.className = 'flying-wish-text';
            wishElem.textContent = `✨ ${wishText} ✨`;
            wishElem.style.left = `${startX}px`;
            wishElem.style.top = `${startY}px`;
            wishElem.style.transform = 'translate(-50%, -50%) scale(1)';
            document.body.appendChild(wishElem);

            // Animate flying toward the moon
            let step = 0;
            const totalSteps = 45;

            const flyInterval = setInterval(() => {
                step++;
                const progress = step / totalSteps;
                // Cubic ease out trajectory
                const ease = 1 - Math.pow(1 - progress, 3);

                const currentX = startX + (targetX - startX) * ease;
                // Add slight upward curve
                const arcY = Math.sin(progress * Math.PI) * -60;
                const currentY = startY + (targetY - startY) * ease + arcY;

                const scale = 1 - progress * 0.45;
                const opacity = progress > 0.75 ? (1 - progress) / 0.25 : 1;

                wishElem.style.left = `${currentX}px`;
                wishElem.style.top = `${currentY}px`;
                wishElem.style.transform = `translate(-50%, -50%) scale(${scale})`;
                wishElem.style.opacity = opacity;

                // Create trailing sparkles along flight path
                if (step % 2 === 0) {
                    createSparkleTrail(currentX, currentY);
                }

                if (step >= totalSteps) {
                    clearInterval(flyInterval);
                    wishElem.remove();

                    // Burst star particles on moon hit
                    triggerMoonBurst(targetX, targetY);
                    
                    // Trigger pulse on moon
                    moon.style.transform = 'scale(1.1)';
                    setTimeout(() => {
                        moon.style.transform = '';
                    }, 400);

                    showToast("소원이 보름달에 전달되었습니다! 🌕✨");
                    input.value = '';
                }
            }, 24);
        }

        // Particle effect trailing behind flying wish
        function createSparkleTrail(x, y) {
            const particle = document.createElement('div');
            particle.className = 'wish-particle';
            const size = Math.random() * 8 + 4;
            particle.style.width = `${size}px`;
            particle.style.height = `${size}px`;
            particle.style.left = `${x + (Math.random() * 16 - 8)}px`;
            particle.style.top = `${y + (Math.random() * 16 - 8)}px`;
            
            const dx = (Math.random() - 0.5) * 30;
            const dy = Math.random() * 20 + 10;
            particle.style.setProperty('--tw-translateX', `${dx}px`);
            particle.style.setProperty('--tw-translateY', `${dy}px`);

            document.body.appendChild(particle);
            setTimeout(() => particle.remove(), 800);
        }

        // Explosion of golden light particles when wish reaches moon
        function triggerMoonBurst(x, y) {
            const count = 30;
            for (let i = 0; i < count; i++) {
                const particle = document.createElement('div');
                particle.className = 'wish-particle';
                const size = Math.random() * 10 + 5;
                particle.style.width = `${size}px`;
                particle.style.height = `${size}px`;
                particle.style.left = `${x}px`;
                particle.style.top = `${y}px`;

                const angle = (Math.PI * 2 / count) * i + (Math.random() * 0.2);
                const distance = Math.random() * 80 + 40;
                const dx = Math.cos(angle) * distance;
                const dy = Math.sin(angle) * distance;

                particle.style.setProperty('--tw-translateX', `${dx}px`);
                particle.style.setProperty('--tw-translateY', `${dy}px`);

                document.body.appendChild(particle);
                setTimeout(() => particle.remove(), 800);
            }
        }

        // Replay moon rise animation on click/tap
        function replayMoonRise() {
            const wrapper = document.querySelector('.moon-rise-wrapper');
            if (!wrapper) return;
            wrapper.style.animation = 'none';
            wrapper.offsetHeight; // trigger DOM reflow
            wrapper.style.animation = 'moonRise 3.5s cubic-bezier(0.16, 1, 0.3, 1) forwards';
        }

        // Generate random star background inside card
        function createStars() {
            const container = document.getElementById('stars-container');
            if (!container) return;
            container.innerHTML = ''; // Clear existing stars
            const count = 65; // Richer sky density

            for (let i = 0; i < count; i++) {
                const star = document.createElement('div');
                const isSparkle = Math.random() > 0.78; // 22% special diamond sparkle stars

                if (isSparkle) {
                    star.className = 'star sparkle-star';
                    const size = Math.random() * 6 + 4;
                    star.style.width = `${size}px`;
                    star.style.height = `${size}px`;
                } else {
                    star.className = 'star';
                    const size = Math.random() * 2.8 + 1;
                    star.style.width = `${size}px`;
                    star.style.height = `${size}px`;
                }

                star.style.left = `${Math.random() * 100}%`;
                star.style.top = `${Math.random() * 100}%`;
                star.style.animationDelay = `${Math.random() * 4}s`;
                star.style.animationDuration = `${Math.random() * 2.5 + 1.5}s`;
                container.appendChild(star);
            }
        }

        // Show elegant Toast Message instead of alert()
        function showToast(message) {
            const toast = document.getElementById('toast-message');
            const toastText = document.getElementById('toast-text');
            if (!toast || !toastText) return;

            toastText.textContent = message;
            toast.classList.remove('opacity-0', 'pointer-events-none');
            toast.classList.add('opacity-100');

            setTimeout(() => {
                toast.classList.remove('opacity-100');
                toast.classList.add('opacity-0', 'pointer-events-none');
            }, 3000);
        }

        // Export Card to PNG Image
        async function downloadCardImage() {
            const cardElement = document.getElementById('chuseok-card');
            const button = document.getElementById('download-btn');

            if (!cardElement) return;

            try {
                // UI feedback
                if (button) {
                    button.disabled = true;
                    button.classList.add('opacity-75');
                }

                showToast("카드를 이미지로 변환하고 있습니다...");

                // Capture card with html2canvas (High DPI quality output)
                const canvas = await html2canvas(cardElement, {
                    scale: 3, // High quality resolution
                    useCORS: true,
                    backgroundColor: null,
                    logging: false,
                    onclone: (clonedDoc) => {
                        // Ensure cloned card maintains perfect proportions
                        const clonedCard = clonedDoc.getElementById('chuseok-card');
                        if (clonedCard) {
                            clonedCard.style.boxShadow = 'none';
                        }
                    }
                });

                // Convert canvas to image download
                const imageUrl = canvas.toDataURL('image/png');
                const link = document.createElement('a');
                link.href = imageUrl;
                link.download = '한가위_추석인사_이정은드림.png';
                document.body.appendChild(link);
                link.click();
                document.body.removeChild(link);

                showToast("추석 카드가 저장되었습니다! 갤러리에서 확인해보세요.");

            } catch (error) {
                console.error("Card capture error:", error);
                showToast("이미지 저장 중 오류가 발생했습니다. 다시 시도해 주세요.");
            } finally {
                if (button) {
                    button.disabled = false;
                    button.classList.remove('opacity-75');
                }
            }
        }

        // Initialize elements on load
        window.onload = function() {
            createStars();
        };
    </script>
</body>
</html>
